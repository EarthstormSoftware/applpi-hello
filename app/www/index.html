<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello</title>
<!-- The Juggle OS icon: three balls on a juggler's figure of eight -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='8 -17 184 184'%3E%3Cpath d='M100 75C130 30 175 30 175 75S130 120 100 75 25 30 25 75 70 120 100 75Z' fill='none' stroke='%236b7080' stroke-width='16'/%3E%3Ccircle cx='51' cy='41' r='22' fill='%233ddc84'/%3E%3Ccircle cx='100' cy='75' r='20' fill='%23ffb020'/%3E%3Ccircle cx='149' cy='109' r='22' fill='%234da3ff'/%3E%3C/svg%3E">
<style>
/* As the Pico projects' pages. Colours: text is at least 4.5:1 on its background, borders 3:1. */
:root{color-scheme:light dark;
  --page:#667eea;--card:#fff;--text:#333;--text2:#4a4f5c;--muted:#6b7080;
  --line:#e6e7ec;--border:#8c92a0;--field:#fff;--accent:#4a56c9;--on-accent:#fff;
  --on:#2e7d32;--chip:#f1f3f9;--ok-bg:#e7f5e8;--ok:#1e6b23;--bad-bg:#fdecea;--bad:#a12622}
@media (prefers-color-scheme:dark){:root{
  --page:#14151d;--card:#22242f;--text:#e8e9ef;--text2:#c4c7d2;--muted:#9aa0b0;
  --line:#33364a;--border:#6b7080;--field:#2b2e3b;--accent:#9aa8ff;--on-accent:#14151d;
  --chip:#2f3240;--ok-bg:#1f3a24;--ok:#8fd694;--bad-bg:#452523;--bad:#ff9e98}}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:system-ui,sans-serif;background:var(--page);color:var(--text);min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.card{background:var(--card);border-radius:12px;width:100%;max-width:760px;overflow:hidden}
header{padding:20px 20px 0;text-align:center}
h1{font-size:21px;color:var(--text);margin-bottom:6px}
.badge{display:inline-block;padding:3px 12px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:12px;background:var(--chip);color:var(--text2)}
.badge.on{background:var(--on);color:#fff}
.alert{margin:0 20px 12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px;text-align:left}
/* CSS-only tabs: radio inputs drive panel visibility, hidden visually but focusable */
input[name=t]{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
nav{display:flex;border-bottom:2px solid var(--line)}
nav label{flex:1;padding:11px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:.15s}
nav label:hover{color:var(--text)}
.pane{display:none;padding:20px}
#tst:checked~nav label[for=tst],#ts:checked~nav label[for=ts]{color:var(--accent);border-bottom-color:var(--accent)}
#tst:checked~#pst,#ts:checked~#ps{display:block}
#tst:focus-visible~nav label[for=tst],#ts:focus-visible~nav label[for=ts]{outline:2px solid var(--accent);outline-offset:-4px;border-radius:6px}
.greeting{font-size:19px;font-weight:600;text-align:center;margin-bottom:20px;color:var(--accent)}
.facts{display:grid;grid-template-columns:minmax(96px,max-content) 1fr;gap:6px 16px;font-size:13px;margin-bottom:8px}
.facts dt{color:var(--muted)}
.facts dd{color:var(--text);overflow-wrap:anywhere}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 32px}
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.sec:first-child{margin-top:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
input[type=text]{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--field);color:var(--text)}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.note{font-size:12px;color:var(--muted);margin-bottom:8px}
.msg{font-size:12px;color:var(--bad);min-height:16px;margin-top:4px}
.msg.good{color:var(--ok)}
.btn-full{display:block;width:100%;margin-top:10px;padding:11px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn-full:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.noscript{margin:0 20px 12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
footer{font-size:11px;color:var(--muted);text-align:center;padding:10px 0 14px}
</style>
</head>
<body>
<div class="card">
<header>
  <h1 id="name">Hello</h1>
  <span class="badge" id="state">Loading&hellip;</span>
</header>
<div class="alert" id="alert" role="alert" hidden></div>
<noscript><p class="noscript">This page needs JavaScript. Turn it on for this site, then reload.</p></noscript>

<input type="radio" name="t" id="tst" aria-label="Status tab" checked>
<input type="radio" name="t" id="ts" aria-label="Settings tab">
<nav>
  <label for="tst">Status</label>
  <label for="ts">Settings</label>
</nav>

<div class="pane" id="pst">
  <p class="greeting" id="greeting">&nbsp;</p>
  <div class="status">
  <div>
  <div class="sec">Pi</div>
  <dl class="facts">
    <dt>Up for</dt><dd id="s_up">&mdash;</dd>
    <dt>Temperature</dt><dd id="s_temp">&mdash;</dd>
    <dt>Free memory</dt><dd id="s_mem">&mdash;</dd>
    <dt>Load</dt><dd id="s_load">&mdash;</dd>
  </dl>
  </div>
  <div>
  <div class="sec">Software</div>
  <dl class="facts">
    <dt>App</dt><dd id="s_app">&mdash;</dd>
    <dt>App up for</dt><dd id="s_app_up">&mdash;</dd>
    <dt>Juggle OS</dt><dd id="s_os">&mdash;</dd>
    <dt>OS slot</dt><dd id="s_slot">&mdash;</dd>
  </dl>
  </div>
  </div>
</div>

<div class="pane" id="ps">
  <form id="settings">
    <div class="sec">Greeting</div>
    <div class="field"><label for="greet">Greeting</label>
      <input type="text" id="greet" maxlength="64" required aria-describedby="greet_help">
    </div>
    <p class="note" id="greet_help">Shown on the Status tab. It's kept on the Pi's data partition, so it stays through
      deploys of this app and OS updates.</p>
    <button class="btn-full" id="save">Save</button>
    <p class="msg" id="save_msg" role="status"></p>
  </form>
</div>
<footer>Juggle OS example app</footer>
</div>
<script>
const $ = id => document.getElementById(id);
function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min ${s % 60} s`;
}
async function refresh() {
  try {
    const r = await fetch('/api/info', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const i = await r.json();
    $('name').textContent = i.device.name;
    document.title = `${i.device.name} - Hello`;
    $('state').textContent = 'Running'; $('state').className = 'badge on';
    $('alert').hidden = true;
    $('greeting').textContent = i.greeting;
    $('s_up').textContent = duration(i.device.up_s);
    $('s_temp').textContent = i.device.temperature_c == null ? 'unknown' : `${i.device.temperature_c} °C`;
    $('s_mem').textContent = i.device.memory_free_mib == null ? 'unknown' : `${i.device.memory_free_mib} MiB`;
    $('s_load').textContent = i.device.load.toFixed(2);
    $('s_app').textContent = `${i.app.name} ${i.app.version}`;
    $('s_app_up').textContent = duration(i.app.up_s);
    $('s_os').textContent = i.os.version ? `${i.os.version}, build ${i.os.build} UTC` : 'not Juggle OS';
    $('s_slot').textContent = i.os.slot || 'unknown';
  } catch (e) {
    $('state').textContent = 'Not answering'; $('state').className = 'badge';
    $('alert').textContent = "The Pi isn't answering. It may be restarting; this page keeps trying.";
    $('alert').hidden = false;
  }
}
async function loadSettings() {
  const r = await fetch('/api/config', {cache: 'no-store'});
  if (r.ok) $('greet').value = (await r.json()).greeting;
}
$('settings').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('save_msg');
  $('save').disabled = true;
  try {
    const r = await fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify({greeting: $('greet').value})});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.status);
    $('greet').value = body.greeting;
    msg.textContent = 'Saved'; msg.className = 'msg good';
    refresh();
  } catch (e) {
    msg.textContent = `Not saved: ${e.message}`; msg.className = 'msg';
  } finally {
    $('save').disabled = false;
  }
});
refresh();
loadSettings();
setInterval(refresh, 5000);
</script>
</body>
</html>
